<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>america.sx — admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230b1424'/%3E%3Cpath d='M32 6 L56 14 V31 C56 45 45 54 32 58 C19 54 8 45 8 31 V14 Z' fill='none' stroke='%23c8a45c' stroke-width='3'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b1424;--panel:#111d33;--panel2:#17263f;--rule:#283a5c;--text:#e2e8f4;
  --muted:#8797b3;--dim:#526486;--gold:#c8a45c;--red:#d5433f;--amber:#d5932f;--blue:#5c8fd6;--green:#6fbf73;
  --mono:'IBM Plex Mono',ui-monospace,monospace;--disp:'Oswald',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--mono);font-size:13px;line-height:1.5}
a{color:var(--gold)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--rule);box-shadow:0 1px 0 rgba(200,164,92,.14)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{font-family:var(--disp);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:18px}
.brand i{font-style:normal;color:var(--gold);font-weight:400}
.brand em{font-style:normal;color:var(--dim);font-size:12px;margin-left:8px;letter-spacing:.2em}
button,input,textarea,select{font-family:var(--mono);font-size:13px}
button{background:var(--gold);color:var(--ink);border:0;padding:9px 16px;border-radius:2px;cursor:pointer;
  font-family:var(--disp);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--rule)}
button.ghost:hover{color:var(--gold);border-color:var(--gold)}
button.danger{background:transparent;color:var(--red);border:1px solid var(--rule)}
button.danger:hover{border-color:var(--red)}
input,textarea,select{background:var(--ink);border:1px solid var(--rule);color:var(--text);padding:8px 10px;border-radius:2px;width:100%}
.tabs{display:flex;gap:4px;margin:22px 0 18px;flex-wrap:wrap}
.tabs button{background:transparent;color:var(--muted);border:1px solid var(--rule)}
.tabs button.on{background:var(--panel2);color:var(--gold);border-color:var(--gold-dim,#8a7440)}
.card{border:1px solid var(--rule);background:var(--panel);border-radius:2px;padding:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stat b{font-family:var(--disp);font-weight:700;font-size:26px;display:block;color:var(--text)}
.stat span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px 10px;color:var(--gold);font-family:var(--disp);font-weight:500;font-size:11px;
  letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--rule)}
td{padding:8px 10px;border-bottom:1px solid var(--rule);color:var(--muted);vertical-align:top}
td.mono{font-size:11px;color:var(--text);word-break:break-all}
.badge{font-family:var(--disp);font-weight:700;font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 6px;border:1px solid currentColor;border-radius:2px}
.b-bundled{color:var(--red)} .b-cabaled{color:var(--amber)} .b-organic{color:var(--blue)}
.b-inconclusive{color:var(--muted)} .b-open{color:var(--amber)} .b-resolved{color:var(--green)} .b-dismissed{color:var(--dim)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.msg{font-size:12px;color:var(--gold);min-height:16px;margin:8px 0}
.login{max-width:360px;margin:80px auto;text-align:center}
.login h1{font-family:var(--disp);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.hidden{display:none}
.muted{color:var(--dim);font-size:11px}
.modal-bg{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  background:rgba(8,15,28,.72);backdrop-filter:blur(3px);padding:20px}
.modal{width:100%;max-width:380px;border:1px solid var(--gold-dim,#8a7440);background:var(--panel);
  border-radius:3px;padding:20px}
.modal h2{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 14px;color:var(--gold)}
.modal input{margin-bottom:10px}
.modal .row{margin:12px 0 0}
</style>
</head>
<body>

<div class="modal-bg hidden" id="pwModal">
  <form class="modal" id="pwForm">
    <h2>Admin şifresi değiştir</h2>
    <input id="pw1" type="password" placeholder="yeni şifre (en az 8)" autocomplete="new-password">
    <input id="pw2" type="password" placeholder="yeni şifre (tekrar)" autocomplete="new-password">
    <div class="msg" id="pwMsg"></div>
    <div class="row">
      <button type="submit">Kaydet</button>
      <button type="button" class="ghost" id="pwCancel">Vazgeç</button>
    </div>
  </form>
</div>
<header><div class="wrap">
  <div class="brand">america<i>.sx</i><em>admin</em></div>
  <div style="display:flex;gap:8px">
    <a class="ghost" href="/" style="display:inline-block;padding:9px 16px;border:1px solid var(--rule);border-radius:2px;text-decoration:none;color:var(--muted);font-family:var(--disp);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:12px">Ana sayfa</a>
    <button class="ghost hidden" id="chpw">Şifre değiştir</button>
    <button class="ghost hidden" id="logout">Çıkış</button>
  </div>
</div></header>

<div class="wrap">
  <div id="loginView" class="login">
    <h1>Admin</h1>
    <p class="muted">ADMIN_TOKEN env değerini gir.</p>
    <input id="tok" type="password" placeholder="admin token" autocomplete="off">
    <div class="msg" id="loginMsg"></div>
    <button id="loginBtn" style="width:100%">Gir</button>
  </div>

  <div id="panel" class="hidden">
    <div class="tabs" id="tabs">
      <button data-t="overview" class="on">Genel</button>
      <button data-t="appeals">İtirazlar</button>
      <button data-t="track">Karne</button>
      <button data-t="tools">Önbellek / Tarama</button>
      <button data-t="flagged">İşaretli cüzdanlar</button>
      <button data-t="lessons">AI tespit</button>
    </div>
    <div class="msg" id="msg"></div>
    <div id="view"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let TOKEN = '';
try{ TOKEN = localStorage.getItem('asx_admin') || ''; }catch(e){}

async function api(path, opts={}){
  const r = await fetch('/api/admin'+path, {
    ...opts,
    headers:{'Content-Type':'application/json','X-Admin-Token':TOKEN, ...(opts.headers||{})}
  });
  if(r.status === 401 || r.status === 404){ showLogin(r.status===404 ? 'Panel kapalı (ADMIN_TOKEN yok).' : 'Token geçersiz.'); throw new Error('auth'); }
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.detail || ('HTTP '+r.status));
  return j;
}
function showLogin(m){
  $('#panel').classList.add('hidden'); $('#loginView').classList.remove('hidden');
  $('#chpw').classList.add('hidden'); $('#logout').classList.add('hidden');
  if(m) $('#loginMsg').textContent = m;
}
function showPanel(){
  $('#loginView').classList.add('hidden'); $('#panel').classList.remove('hidden');
  $('#chpw').classList.remove('hidden'); $('#logout').classList.remove('hidden');
}
function flash(m){ $('#msg').textContent = m; setTimeout(()=>{ if($('#msg').textContent===m) $('#msg').textContent=''; }, 2500); }
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const vb = v => `<span class="badge b-${v||'open'}">${esc(v||'—')}</span>`;
const short = a => a ? a.slice(0,4)+'…'+a.slice(-4) : '—';
const ago = ts => { const s=Math.floor(Date.now()/1000-ts); if(s<3600)return Math.floor(s/60)+'d'; if(s<86400)return Math.floor(s/3600)+'sa'; return Math.floor(s/86400)+'g'; };
const money = n => n==null?'—':(n>=1e6?'$'+(n/1e6).toFixed(1)+'M':n>=1e3?'$'+Math.round(n/1e3)+'k':'$'+Math.round(n));

$('#loginBtn').onclick = async ()=>{
  TOKEN = $('#tok').value.trim();
  try{ localStorage.setItem('asx_admin', TOKEN); }catch(e){}
  try{ await api('/overview'); showPanel(); route('overview'); }catch(e){}
};
$('#tok').addEventListener('keydown', e=>{ if(e.key==='Enter') $('#loginBtn').click(); });
$('#logout').onclick = ()=>{ TOKEN=''; try{localStorage.removeItem('asx_admin');}catch(e){} showLogin(''); };
function pwClose(){ $('#pwModal').classList.add('hidden'); $('#pw1').value=''; $('#pw2').value=''; $('#pwMsg').textContent=''; }
$('#chpw').onclick = ()=>{ $('#pwModal').classList.remove('hidden'); $('#pw1').focus(); };
$('#pwCancel').onclick = pwClose;
$('#pwModal').onclick = e=>{ if(e.target === $('#pwModal')) pwClose(); };
$('#pwForm').onsubmit = async e=>{
  e.preventDefault();
  const a = $('#pw1').value, b = $('#pw2').value;
  if(a.length < 8){ $('#pwMsg').textContent = 'En az 8 karakter olmalı.'; return; }
  if(a !== b){ $('#pwMsg').textContent = 'Şifreler eşleşmedi.'; return; }
  try{
    await api('/password', {method:'POST', body:JSON.stringify({new:a})});
    TOKEN = a; try{ localStorage.setItem('asx_admin', a); }catch(e){}
    pwClose(); flash('şifre değiştirildi');
  }catch(err){ $('#pwMsg').textContent = err.message; }
};
$('#tabs').onclick = e=>{ const b=e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on', x===b)); route(b.dataset.t); };

async function route(t){
  const v = $('#view'); v.innerHTML = '<p class="muted">yükleniyor…</p>';
  try{
    if(t==='overview') return renderOverview(await api('/overview'));
    if(t==='appeals')  return renderAppeals();
    if(t==='track')    return renderTrack(await api('/track'));
    if(t==='tools')    return renderTools();
    if(t==='flagged')  return renderFlagged(await api('/flagged'));
    if(t==='lessons')  return renderLessons(await api('/lessons'));
  }catch(e){ if(e.message!=='auth') v.innerHTML = `<p style="color:var(--red)">${esc(e.message)}</p>`; }
}

function renderOverview(d){
  const s = d.stats, c = d.config;
  const cards = [
    ['scans_cached','önbellekte'],['scans_total','toplam tarama'],
    ['track_open','izlenen'],['track_settled','sonuçlanan'],['track_correct','doğru'],['track_miss','kaçırılan'],
    ['appeals_open','açık itiraz'],['flagged','işaretli cüzdan'],['lessons','AI tespit'],
  ].map(([k,l])=>`<div class="card stat"><b>${s[k]??0}</b><span>${l}</span></div>`).join('');
  const prov = Object.entries(d.providers||{});
  const totalCalls = prov.reduce((n,[,p])=>n+(p.calls||0),0);
  const provRows = prov.map(([k,p])=>
    `<tr><td class="mono">${esc(k)}</td><td>${p.calls}</td><td>${p.failures}</td><td>${p.available?'✓':'cooldown'}</td></tr>`).join('');
  const q = c.rpc_quota||0;
  const rpcCard = q
    ? `<div class="card stat"><b>${Math.max(0,q-totalCalls).toLocaleString()}</b><span>kalan RPC sorgusu (~${Math.floor(Math.max(0,q-totalCalls)/200)} tarama)</span></div>`
    : `<div class="card stat"><b>${totalCalls.toLocaleString()}</b><span>RPC sorgusu (instance başından)</span></div>`;
  $('#view').innerHTML = `
    <div class="grid">${cards}${rpcCard}</div>
    <div class="card"><b class="muted">DEPO:</b> ${esc(s.backend)} &nbsp; · &nbsp;
      izleme ${c.track_window_sec/3600}sa &nbsp; · &nbsp; çöküş eşiği %${Math.round(c.track_drop_pct*100)} &nbsp; · &nbsp;
      min mcap $${c.min_market_cap} &nbsp; · &nbsp; rate ${c.rate_limit_per_min}/dk
      ${q?`&nbsp; · &nbsp; RPC kotası ${q.toLocaleString()}/ay`:''}
      <div class="muted" style="margin-top:6px">RPC sayacı instance yeniden başladığında sıfırlanır (aylık gerçek kullanımı Helius panelinden gör).</div></div>
    <div class="card"><table><thead><tr><th>RPC sağlayıcı</th><th>çağrı</th><th>hata</th><th>durum</th></tr></thead>
      <tbody>${provRows||'<tr><td colspan=4 class=muted>—</td></tr>'}</tbody></table></div>`;
}

async function renderAppeals(){
  const st = window.__astatus || '';
  const d = await api('/appeals'+(st?('?status='+st):''));
  const rows = (d.appeals||[]).map(a=>`
    <tr>
      <td>${vb(a.status)}</td>
      <td>${vb(a.verdict)}<div class="muted">${ago(a.created_at)} önce</div></td>
      <td class="mono">${short(a.mint)}<div class="muted">${esc(a.contact||'')}</div></td>
      <td>${esc(a.body)}${a.note?`<div class="muted">not: ${esc(a.note)}</div>`:''}</td>
      <td style="white-space:nowrap">
        <button class="ghost" data-a="${a.id}" data-s="resolved">çöz</button>
        <button class="ghost" data-a="${a.id}" data-s="dismissed">yok say</button>
        <a href="/t/${esc(a.mint)}" target="_blank">↗</a>
      </td>
    </tr>`).join('');
  $('#view').innerHTML = `
    <div class="row">
      <button class="ghost ${st===''?'on':''}" data-f="">hepsi</button>
      <button class="ghost ${st==='open'?'on':''}" data-f="open">açık</button>
      <button class="ghost ${st==='resolved'?'on':''}" data-f="resolved">çözülmüş</button>
      <button class="ghost ${st==='dismissed'?'on':''}" data-f="dismissed">yok sayılan</button>
    </div>
    <div class="card"><table><thead><tr><th>durum</th><th>karar</th><th>token</th><th>gerekçe</th><th></th></tr></thead>
      <tbody>${rows||'<tr><td colspan=5 class=muted>itiraz yok</td></tr>'}</tbody></table></div>`;
  $('#view').querySelectorAll('[data-f]').forEach(b=> b.onclick = ()=>{ window.__astatus = b.dataset.f; renderAppeals(); });
  $('#view').querySelectorAll('[data-a]').forEach(b=> b.onclick = async ()=>{
    const note = prompt('Not (opsiyonel):','') || '';
    await api('/appeals/'+b.dataset.a, {method:'POST', body:JSON.stringify({status:b.dataset.s, note})});
    flash('güncellendi'); renderAppeals();
  });
}

function renderTrack(d){
  const rows = (d.records||[]).map(t=>{
    const chg = t.change_pct;
    const dl = chg==null?'—':((chg>0?'+':'')+Math.round(chg*100)+'%');
    return `<tr>
      <td>${vb(t.verdict)}</td>
      <td class="mono">${esc(t.symbol||short(t.mint))}<div class="muted">${short(t.mint)}</div></td>
      <td>${money(t.mcap_at_scan)} → ${money(t.mcap_latest)} <b style="color:${chg<0?'var(--red)':'var(--green)'}">${dl}</b></td>
      <td>${t.settled?vb(t.outcome):('izleniyor '+ago(t.scored_at))}</td>
      <td><button class="danger" data-m="${esc(t.mint)}">sil</button></td>
    </tr>`;
  }).join('');
  $('#view').innerHTML = `<div class="card"><table>
    <thead><tr><th>karar</th><th>token</th><th>mcap</th><th>sonuç</th><th></th></tr></thead>
    <tbody>${rows||'<tr><td colspan=5 class=muted>—</td></tr>'}</tbody></table></div>`;
  $('#view').querySelectorAll('[data-m]').forEach(b=> b.onclick = async ()=>{
    if(!confirm('Karne kaydı silinsin mi?')) return;
    await api('/track/'+b.dataset.m, {method:'DELETE'}); flash('silindi'); route('track');
  });
}

function renderTools(){
  $('#view').innerHTML = `
    <div class="card">
      <p class="muted">Bir mint için önbelleği temizle ya da zorla yeniden tara.</p>
      <div class="row"><input id="tmint" placeholder="mint adresi" style="flex:1"></div>
      <div class="row">
        <button class="ghost" id="tclear">önbelleği sil</button>
        <button id="trescan">zorla yeniden tara</button>
      </div>
      <pre id="tout" class="muted" style="white-space:pre-wrap;max-height:280px;overflow:auto"></pre>
    </div>`;
  $('#tclear').onclick = async ()=>{
    const m = $('#tmint').value.trim(); if(!m) return;
    await api('/cache/'+m, {method:'DELETE'}); flash('önbellek silindi');
  };
  $('#trescan').onclick = async ()=>{
    const m = $('#tmint').value.trim(); if(!m) return;
    $('#tout').textContent = 'taranıyor… (60-90 sn)';
    try{ const j = await api('/rescan/'+m, {method:'POST'});
      $('#tout').textContent = `${j.verdict.label} · skor ${j.verdict.score} · güven ${j.verdict.confidence}\n`+
        (j.verdict.reasons||[]).join('\n'); flash('tarandı');
    }catch(e){ $('#tout').textContent = e.message; }
  };
}

function renderFlagged(d){
  const rows = (d.flagged||[]).map(f=>`<tr>
    <td class="mono">${esc(f.address)}<div class="muted">${f.kind==='deployer'?'deployer · ':''}${f.via&&f.via!=='manual'?('← '+short(f.via)):'elle'}</div></td>
    <td><span class="badge b-open">×${f.hits||1}</span> ${esc(f.note||'')}<div class="muted">${ago(f.created_at)} önce</div></td>
    <td><button class="danger" data-x="${esc(f.address)}">kaldır</button></td>
  </tr>`).join('');
  $('#view').innerHTML = `
    <div class="card">
      <p class="muted">Motorun "işaretli cüzdan / deployer" sinyalinde anında kullanılır. ×N = kaç ayrı çöküşte görüldü.</p>
      <div class="row">
        <input id="faddr" placeholder="cüzdan adresi" style="flex:2 1 260px">
        <input id="fnote" placeholder="not (ör. X tokende pakette görüldü)" style="flex:3 1 260px">
        <button id="fadd">ekle</button>
      </div>
    </div>
    <div class="card"><table><thead><tr><th>adres</th><th>not</th><th></th></tr></thead>
      <tbody>${rows||'<tr><td colspan=3 class=muted>liste boş</td></tr>'}</tbody></table></div>`;
  $('#fadd').onclick = async ()=>{
    const address = $('#faddr').value.trim(); if(!address) return;
    try{ await api('/flagged', {method:'POST', body:JSON.stringify({address, note:$('#fnote').value.trim()})});
      flash('eklendi'); route('flagged');
    }catch(e){ flash(e.message); }
  };
  $('#view').querySelectorAll('[data-x]').forEach(b=> b.onclick = async ()=>{
    await api('/flagged/'+encodeURIComponent(b.dataset.x), {method:'DELETE'}); flash('kaldırıldı'); route('flagged');
  });
}

function renderLessons(d){
  const rows = (d.lessons||[]).map(l=>`<tr>
    <td>${vb(l.verdict_was)}<div class="muted">${ago(l.learned_at)} önce</div></td>
    <td class="mono">${esc(l.symbol||short(l.mint))}<div class="muted">${short(l.mint)}</div></td>
    <td><b style="color:var(--red)">−%${Math.round((l.drop_pct||0)*100)}</b></td>
    <td>${esc(l.detail||'')}${l.deployer?`<div class="muted">deployer: ${short(l.deployer)}</div>`:''}</td>
    <td style="white-space:nowrap">${l.wallets_flagged||0} cüzdan
      ${l.wallets_flagged?`<button class="ghost" data-u="${esc(l.mint)}">geri al</button>`:''}</td>
  </tr>`).join('');
  $('#view').innerHTML = `
    <div class="card"><p class="muted">"organic/inconclusive" denip sonradan sert çöken (≥%55) tokenlar.
      Koordinasyon izi bulunduysa o cüzdanlar/deployer işaretlendi ve sonraki taramalarda kullanılıyor.
      Yanlışsa "geri al".</p></div>
    <div class="card"><table><thead><tr><th>karar</th><th>token</th><th>çöküş</th><th>ne öğrenildi</th><th>eylem</th></tr></thead>
      <tbody>${rows||'<tr><td colspan=5 class=muted>henüz ders yok</td></tr>'}</tbody></table></div>`;
  $('#view').querySelectorAll('[data-u]').forEach(b=> b.onclick = async ()=>{
    if(!confirm('Bu dersin işaretlediği cüzdanlar geri alınsın mı?')) return;
    const j = await api('/lessons/'+b.dataset.u+'/undo', {method:'POST'});
    flash((j.removed||0)+' cüzdan geri alındı'); route('lessons');
  });
}

// açılış
if(TOKEN){ api('/overview').then(()=>{ showPanel(); route('overview'); }).catch(()=>{}); }
else showLogin('');
</script>
</body>
</html>
