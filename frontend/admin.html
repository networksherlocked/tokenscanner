<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>america.sx — admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230b1424'/%3E%3Cpath d='M32 6 L56 14 V31 C56 45 45 54 32 58 C19 54 8 45 8 31 V14 Z' fill='none' stroke='%23c8a45c' stroke-width='3'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b1424;--panel:#111d33;--panel2:#17263f;--rule:#283a5c;--rule2:#37507a;
  --text:#e2e8f4;--muted:#8797b3;--dim:#526486;
  --gold:#c8a45c;--gold-dim:#8a7440;
  --red:#d5433f;--amber:#d5932f;--blue:#5c8fd6;--green:#6fbf73;
  --mono:'IBM Plex Mono',ui-monospace,monospace;--disp:'Oswald',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--mono);font-size:13px;line-height:1.55}
a{color:var(--gold)}
.wrap{max-width:1060px;margin:0 auto;padding:0 20px}

header{border-bottom:1px solid var(--rule);box-shadow:0 1px 0 rgba(200,164,92,.14)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:56px;gap:12px}
.brand{font-family:var(--disp);font-weight:700;letter-spacing:.1em;font-size:18px}
.brand i{font-style:normal;color:var(--gold);font-weight:700}
.brand em{font-style:normal;color:var(--dim);font-size:11px;margin-left:8px;letter-spacing:.24em}
.hbtns{display:flex;gap:8px}

button,input,textarea,select{font-family:var(--mono);font-size:13px}
button{background:var(--gold);color:var(--ink);border:0;padding:9px 16px;border-radius:2px;cursor:pointer;
  font-family:var(--disp);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
button:hover{filter:brightness(1.08)}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--rule)}
button.ghost:hover{color:var(--gold);border-color:var(--gold-dim)}
button.danger{background:transparent;color:var(--red);border:1px solid var(--rule)}
button.danger:hover{border-color:var(--red)}
button.sm{padding:6px 12px;font-size:11px}
button:disabled{opacity:.5;cursor:progress}
input,textarea,select{background:var(--ink);border:1px solid var(--rule);color:var(--text);
  padding:9px 11px;border-radius:2px;width:100%}
input:focus,textarea:focus{outline:1px solid var(--gold-dim);border-color:var(--gold-dim)}
textarea{resize:vertical;min-height:60px}
code{background:var(--ink);border:1px solid var(--rule);border-radius:2px;padding:1px 5px;font-size:11px}

/* --- sekmeler --- */
.tabs{display:flex;gap:2px;margin:20px 0 20px;flex-wrap:wrap;border-bottom:1px solid var(--rule)}
.tabs button{background:transparent;color:var(--muted);border:1px solid transparent;border-bottom:0;
  border-radius:3px 3px 0 0;padding:10px 18px;position:relative;top:1px}
.tabs button:hover{color:var(--text)}
.tabs button.on{color:var(--gold);border-color:var(--rule);background:var(--panel);
  border-bottom:1px solid var(--panel)}
.subtabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.subtabs button{background:transparent;color:var(--muted);border:1px solid var(--rule);
  padding:7px 14px;font-size:11px}
.subtabs button.on{color:var(--gold);border-color:var(--gold-dim);background:var(--panel2)}

/* --- sayfalama --- */
.pager{display:flex;gap:4px;flex-wrap:wrap;align-items:center;justify-content:center;margin-top:16px}
.pager button{background:transparent;color:var(--muted);border:1px solid var(--rule);
  padding:5px 10px;font-size:11px;min-width:30px;font-family:var(--mono)}
.pager button.on{color:var(--gold);border-color:var(--gold-dim);background:var(--panel2)}
.pager button:disabled{opacity:.35;cursor:default}
.pager .gap{color:var(--dim);padding:0 2px}
.cnt{font-size:11px;color:var(--muted);font-family:var(--mono);margin-left:6px}
td a.sol,td a.tok{color:var(--gold);text-decoration:none}
td a.sol:hover,td a.tok:hover{text-decoration:underline}
button.link{background:transparent;border:1px solid var(--rule);color:var(--muted);
  padding:5px 10px;font-size:11px}
button.link:hover{color:var(--gold);border-color:var(--gold-dim)}
#lsnShareModal .modal{max-width:560px}
#lsnShareModal .subtabs{margin-bottom:0}
#lsnShareModal textarea{width:100%;min-height:250px;font-size:12px;line-height:1.6;margin-top:12px;
  background:var(--ink);border:1px solid var(--rule);color:var(--text);border-radius:2px;
  padding:12px;resize:vertical;font-family:var(--mono)}

/* --- kart --- */
.card{border:1px solid var(--rule);background:var(--panel);border-radius:3px;padding:20px;margin-bottom:14px;
  display:flex;flex-direction:column}
.card > h3{font-family:var(--disp);font-weight:600;font-size:14px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--text);margin:0 0 6px}
/* açıklama metni kutucuğun tam genişliğini doldursun, iki yana yaslı */
.card > .desc{color:var(--muted);font-size:12px;margin:0 0 16px;line-height:1.65;
  width:100%;max-width:none;text-align:justify;text-justify:inter-word}
.card > .desc:last-child{margin-bottom:0}
@media(max-width:820px){.card > .desc,.hint{text-align:left}}
.card > .desc code,.hint code{white-space:nowrap}
.hint{color:var(--dim);font-size:11px;margin-top:8px;line-height:1.55;
  width:100%;max-width:none;text-align:justify;text-justify:inter-word}
.split2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:760px){.split2{grid-template-columns:1fr}}
/* kaydet vb. butonları her kartın sağ alt köşesinde */
.card-actions{display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap;
  margin-top:18px;padding-top:14px;border-top:1px solid var(--rule)}
.card-actions .note{margin-right:auto;color:var(--dim);font-size:11px;max-width:60ch;text-align:left}
.section-title{font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--gold);margin:22px 0 10px}

/* --- form alanları --- */
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);margin-bottom:5px}
.field .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field .row input{flex:1 1 240px}
.statusline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px}

/* --- istatistik / grid --- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.stat{border:1px solid var(--rule);background:var(--panel);border-radius:3px;padding:14px}
.stat b{font-family:var(--disp);font-weight:700;font-size:24px;display:block;color:var(--text);line-height:1.1}
.stat span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.stat.warn b{color:var(--amber)} .stat.bad b{color:var(--red)}

/* --- özet: tek çerçeve, 7 sütun × 2 satır, hücreler ortalı --- */
.sumcard{padding:22px 24px}
.sumrow{display:grid;grid-template-columns:repeat(7,1fr);row-gap:20px}
.sumcell{padding:0 10px 0 0;border-left:1px solid var(--rule);text-align:center}
.sumcell:nth-child(7n+1){border-left:0}
.sumcell b{font-family:var(--disp);font-weight:700;font-size:21px;display:block;color:var(--text);line-height:1.1}
.sumcell span{font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
  display:block;margin-top:5px;line-height:1.35}
.sumcell.warn b{color:var(--amber)} .sumcell.bad b{color:var(--red)}
@media(max-width:820px){
  .sumrow{grid-template-columns:repeat(4,1fr)}
  .sumcell:nth-child(7n+1){border-left:1px solid var(--rule)}
  .sumcell:nth-child(4n+1){border-left:0}
}
@media(max-width:520px){
  .sumrow{grid-template-columns:repeat(2,1fr)}
  .sumcell:nth-child(4n+1){border-left:1px solid var(--rule)}
  .sumcell:nth-child(2n+1){border-left:0}
}

/* --- panel: hero satırı (organik / rpc / karar dağılımı) --- */
.hero3{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:860px){.hero3{grid-template-columns:1fr}}
.hero3 .rpcbox,.hero3 .orgbox,.hero3 .vbox{margin-bottom:0;height:100%;box-sizing:border-box}

/* --- karar dağılımı --- */
.vbox{border:1px solid var(--rule2);background:var(--panel);border-radius:3px;padding:16px}
.vbox .lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.vbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--ink);border:1px solid var(--rule)}
.vbar i{display:block;height:100%}
.vbar .b-bundled{background:var(--red)} .vbar .b-cabaled{background:var(--amber)}
.vbar .b-organic{background:var(--blue)} .vbar .b-inconclusive{background:var(--dim)}
.vleg{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:12px}
.vleg span{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.vleg i{width:8px;height:8px;border-radius:2px;display:inline-block}
.vleg .n{color:var(--text);font-family:var(--disp);font-weight:600}
.vbox.empty{color:var(--dim);font-size:11px}

/* --- son aktivite akışı --- */
.feedgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.feedgrid{grid-template-columns:1fr}}
.feed h4{font-family:var(--disp);font-weight:600;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.feed ul{list-style:none;margin:0;padding:0}
.feed li{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:8px 0;border-bottom:1px solid var(--rule)}
.feed li:last-child{border-bottom:0}
.feed .who{display:flex;align-items:center;gap:8px;min-width:0}
.feed .mono{font-size:11px;color:var(--text)}
.feed .when{font-size:10px;color:var(--dim);white-space:nowrap;flex:none}
.feed .empty{color:var(--dim);font-size:11px;padding:6px 0}

/* --- tablo --- */
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:9px 10px;color:var(--gold);font-family:var(--disp);font-weight:500;font-size:11px;
  letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--rule2)}
td{padding:9px 10px;border-bottom:1px solid var(--rule);color:var(--muted);vertical-align:top}
tr:last-child td{border-bottom:0}
td.mono{font-size:11px;color:var(--text);word-break:break-all}
.tbl-card{border:1px solid var(--rule);background:var(--panel);border-radius:3px;overflow:hidden;margin-bottom:14px}
.tbl-card table{font-size:12px}
.tbl-card th{padding-left:14px}.tbl-card td{padding-left:14px}

.badge{font-family:var(--disp);font-weight:700;font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 7px;border:1px solid currentColor;border-radius:2px;white-space:nowrap}
.b-bundled{color:var(--red)} .b-cabaled{color:var(--amber)} .b-organic{color:var(--blue)}
.b-inconclusive,.b-clear,.b-no_dump{color:var(--muted)}
.b-open{color:var(--amber)} .b-resolved,.b-hit{color:var(--green)} .b-dismissed,.b-miss{color:var(--red)}
.ok{color:var(--green)} .bad{color:var(--red)}

.msg{font-size:12px;color:var(--gold);min-height:18px;margin:10px 0}
.muted{color:var(--dim);font-size:11px}
.hidden{display:none!important}

.hbtn{display:inline-flex;align-items:center;padding:9px 16px;border:1px solid var(--rule);border-radius:2px;
  text-decoration:none;color:var(--muted);background:transparent;cursor:pointer;
  font-family:var(--disp);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.hbtn:hover{color:var(--gold);border-color:var(--gold-dim)}

/* --- giriş --- */
.login{min-height:72vh;display:flex;align-items:center;justify-content:center;padding:40px 0}
.loginbox{width:100%;max-width:380px;border:1px solid var(--gold-dim);border-radius:4px;
  background:linear-gradient(180deg,var(--panel2),var(--panel));padding:36px 30px 30px;text-align:center;
  box-shadow:0 24px 60px rgba(0,0,0,.45)}
.loginbox .crest{width:96px;height:96px;margin:0 auto 14px;display:block;object-fit:contain;
  filter:drop-shadow(0 10px 24px rgba(0,0,0,.5))}
.loginbox svg.crest{color:var(--gold);width:56px;height:56px}
.loginbox .lbrand{font-family:var(--disp);font-weight:700;letter-spacing:.18em;font-size:15px;color:var(--text);margin-bottom:24px}
.loginbox .lbrand span{color:var(--gold);font-weight:400}
.loginbox .ltitle{font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.loginbox .lsub{font-size:12px;color:var(--muted);margin-bottom:22px}
.loginbox input{text-align:center;letter-spacing:.14em;margin-bottom:12px}
.loginbox button{width:100%}
.loginbox .msg{color:var(--red);min-height:16px;margin:10px 0 0}

/* --- RPC göstergesi --- */
.rpcbox{border:1px solid var(--gold-dim);background:var(--panel);border-radius:3px;padding:16px;margin-bottom:14px}
.rpcbox .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.rpcbox .big{font-family:var(--disp);font-weight:700;font-size:30px;color:var(--text);line-height:1}
.rpcbox .lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.rpcbox .live,.orgbox .live{display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--green)}
.rpcbox .live i,.orgbox .live i{width:7px;height:7px;border-radius:50%;background:var(--green);animation:lp 1.4s ease-in-out infinite}
.orgbox .live{color:var(--blue)}.orgbox .live i{background:var(--blue)}
@keyframes lp{0%,100%{opacity:.3}50%{opacity:1}}
.gauge{height:12px;background:var(--ink);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.gauge i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--amber) 75%,var(--red));transition:width .6s ease}
.gauge.flash i{box-shadow:0 0 12px var(--amber)}
.rpcbox .sub{margin-top:8px;font-size:11px;color:var(--muted)}

/* --- organik tespit oranı --- */
.orgbox{border:1px solid var(--blue);background:linear-gradient(180deg,var(--panel2),var(--panel));
  border-radius:3px;padding:16px;margin-bottom:14px}
.orgbox .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.orgbox .lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.orgbox .big{font-family:var(--disp);font-weight:700;font-size:30px;color:var(--blue);line-height:1}
.orgbox .gauge i{background:linear-gradient(90deg,var(--red),var(--amber) 45%,var(--green))}
.orgbox .sub{margin-top:8px;font-size:11px;color:var(--muted)}
.spark{display:flex;align-items:flex-end;gap:2px;height:30px;margin-top:12px}
.spark i{flex:1 1 0;min-width:2px;border-radius:1px;background:var(--green);opacity:.85}
.spark i.miss{background:var(--red)}
.spark.empty{color:var(--dim);font-size:11px;height:auto;display:block}

/* --- modal --- */
.modal-bg{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  background:rgba(8,15,28,.72);backdrop-filter:blur(3px);padding:20px}
.modal-bg.hidden{display:none}
.modal{width:100%;max-width:380px;border:1px solid var(--gold-dim);background:var(--panel);border-radius:3px;padding:20px}
.modal h2{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 14px;color:var(--gold)}
.modal input{margin-bottom:10px}
.modal .row{display:flex;gap:8px;margin-top:12px}
</style>
</head>
<body>

<div class="modal-bg hidden" id="pwModal">
  <form class="modal" id="pwForm">
    <h2>Admin şifresi değiştir</h2>
    <input id="pw1" type="password" placeholder="yeni şifre (en az 8)" autocomplete="new-password">
    <input id="pw2" type="password" placeholder="yeni şifre (tekrar)" autocomplete="new-password">
    <div class="msg" id="pwMsg"></div>
    <div class="row">
      <button type="submit">Kaydet</button>
      <button type="button" class="ghost" id="pwCancel">Vazgeç</button>
    </div>
  </form>
</div>

<div class="modal-bg hidden" id="lsnShareModal">
  <div class="modal">
    <h2>Çöküş dersi — paylaşım metni</h2>
    <div class="subtabs" id="lsnLang">
      <button type="button" data-l="tr" class="on">Türkçe</button>
      <button type="button" data-l="en">English</button>
    </div>
    <textarea id="lsnShareText" readonly></textarea>
    <div class="row">
      <button type="button" id="lsnCopy">Metni kopyala</button>
      <button type="button" class="ghost" id="lsnShareClose">Kapat</button>
    </div>
  </div>
</div>

<header><div class="wrap">
  <div class="brand">AMERICA<i>.SX</i><em>admin</em></div>
  <div class="hbtns">
    <a class="hbtn" href="/">Ana sayfa</a>
    <button class="hbtn hidden" id="chpw">Şifre değiştir</button>
    <button class="hbtn hidden" id="logout">Çıkış</button>
  </div>
</div></header>

<div class="wrap">
  <div id="loginView" class="login">
    <div class="loginbox">
      <img class="crest" src="/eagle.png" alt="" aria-hidden="true"
           onerror="this.onerror=null;this.replaceWith(document.getElementById('crestFallback').content.cloneNode(true))">
      <template id="crestFallback"><svg class="crest" viewBox="0 0 64 64" fill="none" aria-hidden="true"><path d="M32 4 L58 13 V31 C58 46 47 55 32 60 C17 55 6 46 6 31 V13 Z" stroke="currentColor" stroke-width="3"/><path d="M32 13 L27 19 L10 16 L21 27 L6 30 L23 35 L12 45 L32 37 L52 45 L41 35 L58 30 L43 27 L54 16 L37 19 Z" fill="currentColor"/></svg></template>
      <div class="lbrand">AMERICA<span>.SX</span></div>
      <div class="ltitle">Yönetim Paneli</div>
      <div class="lsub">Devam etmek için erişim anahtarını gir.</div>
      <input id="tok" type="password" placeholder="Erişim anahtarı" autocomplete="off">
      <button id="loginBtn">Giriş</button>
      <div class="msg" id="loginMsg"></div>
    </div>
  </div>

  <div id="panel" class="hidden">
    <div class="tabs" id="tabs">
      <button data-t="panel" class="on">Panel</button>
      <button data-t="settings">Ayarlar</button>
      <button data-t="xshare">X paylaşım</button>
      <button data-t="moderation">Denetim</button>
      <button data-t="track">AI izleme</button>
      <button data-t="lessons">AI tespit</button>
      <button data-t="visits">Ziyaretler</button>
      <button data-t="tools">Araçlar</button>
    </div>
    <div class="msg" id="msg"></div>
    <div id="view"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let TOKEN = '';
try{ TOKEN = localStorage.getItem('asx_admin') || ''; }catch(e){}

async function api(path, opts={}){
  const r = await fetch('/api/admin'+path, {
    ...opts,
    headers:{'Content-Type':'application/json','X-Admin-Token':TOKEN, ...(opts.headers||{})}
  });
  if(r.status === 401 || r.status === 404){
    showLogin(r.status===404 ? 'Panel kapalı (ADMIN_TOKEN yok).' : 'Token geçersiz.');
    throw new Error('auth');
  }
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.detail || ('HTTP '+r.status));
  return j;
}
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const vb = v => `<span class="badge b-${(v||'open')}">${esc(v||'—')}</span>`;
const short = a => a ? a.slice(0,4)+'…'+a.slice(-4) : '—';
// tokenın kendi tarama sonucu ekranı (public site + otomatik tarama)
const tokLink = (mint, label) =>
  `<a class="tok" href="/t/${esc(mint)}" target="_blank" rel="noopener" title="tarama sonucunu aç">${esc(label)}</a>`;
const solLink = (addr, label) =>
  `<a class="sol mono" href="https://solscan.io/account/${esc(addr)}" target="_blank" rel="noopener" title="Solscan'de aç">${esc(label ?? addr)}</a>`;
const ago = ts => { const s=Math.floor(Date.now()/1000-ts); if(s<3600)return Math.floor(s/60)+' dk'; if(s<86400)return Math.floor(s/3600)+' sa'; return Math.floor(s/86400)+' g'; };
const money = n => n==null?'—':(n>=1e6?'$'+(n/1e6).toFixed(1)+'M':n>=1e3?'$'+Math.round(n/1e3)+'k':'$'+Math.round(n));
function flash(m){ $('#msg').textContent = m; setTimeout(()=>{ if($('#msg').textContent===m) $('#msg').textContent=''; }, 2600); }

/* --- istemci-tarafı sayfalama --- */
const PAGE_SIZE = 20;
function paginate(items, page){
  const list = items || [];
  const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  page = Math.min(Math.max(1, page|0 || 1), pages);
  return { slice: list.slice((page-1)*PAGE_SIZE, page*PAGE_SIZE), page, pages, total: list.length };
}
function pagerHtml(page, pages, tag){
  if(pages <= 1) return '';
  const want = new Set([1, pages, page, page-1, page+1, page-2, page+2]);
  const nums = [...want].filter(n => n>=1 && n<=pages).sort((a,b)=>a-b);
  let out = `<div class="pager"><button data-pg="${tag}:${page-1}" ${page<=1?'disabled':''}>‹</button>`;
  let prev = 0;
  for(const n of nums){
    if(prev && n-prev > 1) out += `<span class="gap">…</span>`;
    out += `<button data-pg="${tag}:${n}" class="${n===page?'on':''}">${n}</button>`;
    prev = n;
  }
  out += `<button data-pg="${tag}:${page+1}" ${page>=pages?'disabled':''}>›</button></div>`;
  return out;
}

$('#pwForm').onsubmit = async e=>{
  e.preventDefault();
  const a = $('#pw1').value, b = $('#pw2').value;
  if(a.length < 8){ $('#pwMsg').textContent = 'En az 8 karakter olmalı.'; return; }
  if(a !== b){ $('#pwMsg').textContent = 'Şifreler eşleşmedi.'; return; }
  try{
    await api('/password', {method:'POST', body:JSON.stringify({new:a})});
    TOKEN = a; try{ localStorage.setItem('asx_admin', a); }catch(e){}
    pwClose(); flash('şifre değiştirildi');
  }catch(err){ $('#pwMsg').textContent = err.message; }
};

$('#tabs').onclick = e=>{
  const b = e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on', x===b));
  route(b.dataset.t);
};
let _poll = null;
function stopPoll(){ if(_poll){ clearInterval(_poll); _poll = null; } }

async function route(t){
  stopPoll();
  const v = $('#view'); v.className = ''; v.innerHTML = '<p class="muted">yükleniyor…</p>';
  try{
    if(t==='panel')      return renderPanel(await api('/overview'));
    if(t==='settings')   return renderSettings(await api('/settings'));
    if(t==='xshare')     return renderXShare(await api('/settings'));
    if(t==='moderation') return renderModeration();
    if(t==='track')      return renderTrack(await api('/track'));
    if(t==='lessons')    return renderLessons(await api('/lessons'));
    if(t==='visits')     return renderVisits(await api('/visits'));
    if(t==='tools')      return renderTools();
  }catch(e){ if(e.message!=='auth') v.innerHTML = `<p class="bad">${esc(e.message)}</p>`; }
}

function sumRow(items, s){
  return items.map(([k,l,warnIf])=>{
    const v = s[k] ?? 0;
    const cls = warnIf && warnIf(v) ? ' bad' : '';
    return `<div class="sumcell${cls}"><b>${v}</b><span>${l}</span></div>`;
  }).join('');
}

function fmtUptime(sec){
  sec = sec||0;
  const d = Math.floor(sec/86400), h = Math.floor((sec%86400)/3600), m = Math.floor((sec%3600)/60);
  if(d>0) return `${d}g ${h}sa`;
  if(h>0) return `${h}sa ${m}dk`;
  return `${m}dk`;
}
function paintVerdict(d){
  const box = $('#vBox'); if(!box) return;
  const vb2 = (d.stats && d.stats.verdict_breakdown) || {};
  const total = Object.values(vb2).reduce((a,b)=>a+b,0);
  const LBL = {bundled:'bundled', cabaled:'cabaled', organic:'organic', inconclusive:'inconclusive'};
  if(!total){
    box.innerHTML = `<div class="vbox empty">Karar dağılımı · henüz tamamlanmış tarama yok.</div>`;
    return;
  }
  const order = ['bundled','cabaled','organic','inconclusive'];
  const bars = order.map(k=>{
    const pct = (vb2[k]||0)/total*100;
    return pct>0 ? `<i class="b-${k}" style="width:${pct.toFixed(2)}%" title="${LBL[k]} %${pct.toFixed(0)}"></i>` : '';
  }).join('');
  const legend = order.map(k=>
    `<span><i class="b-${k}" style="background:currentColor"></i>${LBL[k]} <span class="n">${vb2[k]||0}</span></span>`
  ).join('');
  box.innerHTML = `<div class="vbox">
    <div class="lbl">Karar dağılımı · toplam ${total}</div>
    <div class="vbar">${bars}</div>
    <div class="vleg">${legend}</div></div>`;
}
function feedRow(mono, badgeHtml, ts){
  return `<li><div class="who"><span class="mono">${esc(mono)}</span>${badgeHtml}</div>
    <span class="when">${ago(ts)} önce</span></li>`;
}
function paintFeed(d){
  const sc = $('#feedScans'), fl = $('#feedFlagged');
  if(sc){
    const rows = d.recent_scans || [];
    sc.innerHTML = rows.length
      ? rows.map(r=> feedRow(short(r.mint), vb(r.verdict), r.created_at)).join('')
      : '<li class="empty">henüz tarama yok</li>';
  }
  if(fl){
    const rows = d.recent_flagged || [];
    fl.innerHTML = rows.length
      ? rows.map(r=> feedRow(short(r.address), `<span class="badge b-open">${esc(r.kind||'wallet')}</span>`, r.created_at)).join('')
      : '<li class="empty">henüz işaretlenen yok</li>';
  }
}
function paintOrg(d){
  const box = $('#orgBox'); if(!box) return;
  const p = (d.stats && d.stats.organic_perf) || {};
  const seq = p.recent || [];
  if(!p.settled){
    box.innerHTML = `<div class="orgbox"><div class="top">
      <div><div class="lbl">Organik tespit oranı</div><div class="big">—</div></div></div>
      <div class="spark empty">Henüz 24 saatlik izlemesi biten "organic" tarama yok. Sonuçlar geldikçe buraya oran ve başarı eğrisi çizilir.</div></div>`;
    return;
  }
  const rate = p.rate != null ? Math.round(p.rate * 100) : 0;
  const bars = seq.map((v,i)=>{
    const w = seq.slice(Math.max(0, i-9), i+1);
    const r = w.reduce((a,b)=>a+b, 0) / w.length;
    return `<i class="${v?'':'miss'}" style="height:${Math.max(8, Math.round(r*100))}%" title="${v?'korudu':'çöktü'}"></i>`;
  }).join('');
  box.innerHTML = `<div class="orgbox"><div class="top">
    <div><div class="lbl">Organik tespit oranı · son ${seq.length} sonuç</div><div class="big">%${rate}</div></div>
    <span class="live"><i></i>canlı</span></div>
    <div class="gauge"><i style="width:${rate}%"></i></div>
    <div class="sub">${p.correct} / ${p.settled} &ldquo;organic&rdquo; çağrısı 24s izlemede korundu · eğri = son 10 sonucun kayan ortalaması</div>
    <div class="spark">${bars}</div></div>`;
}
const calls = d => Object.values(d.providers||{}).reduce((n,p)=>n+(p.calls||0),0);
function paintProv(d){
  const tb = $('#provRows'); if(!tb) return;
  tb.innerHTML = Object.entries(d.providers||{}).map(([k,p])=>
    `<tr><td class="mono">${esc(k)}</td><td>${p.calls}</td><td>${p.failures}</td>
      <td class="${p.available?'ok':'bad'}">${p.available?'✓ hazır':'cooldown'}</td></tr>`
  ).join('') || '<tr><td colspan="4" class="muted">—</td></tr>';
}
function paintRpc(d, bump){
  const box = $('#rpcBox'); if(!box) return;
  const q = (d.config && d.config.rpc_quota) || 0;
  const c = calls(d);
  if(!q){
    box.innerHTML = `<div class="rpcbox"><div class="top">
      <div><div class="lbl">RPC sorgusu (instance başından)</div><div class="big">${c.toLocaleString()}</div></div>
      <span class="live"><i></i>canlı</span></div>
      <div class="sub">Kota tanımlı değil (RPC_MONTHLY_QUOTA). Her tarama bu sayacı artırır; instance yeniden başlayınca sıfırlanır.</div></div>`;
    return;
  }
  const left = Math.max(0, q - c), pct = Math.min(100, c/q*100), scans = Math.floor(left/200);
  box.innerHTML = `<div class="rpcbox"><div class="top">
    <div><div class="lbl">kalan RPC sorgusu</div><div class="big">${left.toLocaleString()}</div></div>
    <span class="live"><i></i>canlı</span></div>
    <div class="gauge" id="rpcGauge"><i style="width:${pct.toFixed(2)}%"></i></div>
    <div class="sub">${c.toLocaleString()} / ${q.toLocaleString()} · %${pct.toFixed(1)} · ~${scans.toLocaleString()} tarama kaldı</div></div>`;
  if(bump){ const g=$('#rpcGauge'); if(g){ g.classList.add('flash'); setTimeout(()=>g.classList.remove('flash'),600); } }
}

async function loadXPosts(){
  const box = $('#xPosts'); if(!box) return;
  try{
    const j = await api('/x/posts');
    const rows = (j.posts||[]).map(p=>`<tr>
      <td>${p.ok?'<span class="ok">✓</span>':'<span class="bad">✗</span>'}</td>
      <td>${vb(p.verdict)}</td>
      <td class="mono">${short(p.mint)}</td>
      <td>${p.tweet_id?`<a href="https://x.com/i/status/${esc(p.tweet_id)}" target="_blank">tweet ↗</a>`:esc((p.detail||'').slice(0,60))}</td>
      <td class="muted">${ago(p.posted_at)} önce</td>
    </tr>`).join('');
    box.innerHTML = rows
      ? `<div class="tbl-card"><table><tbody>${rows}</tbody></table></div>`
      : '<span class="muted">henüz paylaşım yok</span>';
  }catch(e){ box.innerHTML = '<span class="bad">'+esc(e.message)+'</span>'; }
}

let _aiSub = 'lessons', _aiFirst = null;
let _lsnPage = 1, _flgPage = 1, _lsnData = null, _flgData = null;
function renderLessons(d){

// sayfa geçişi — veriyi yeniden çekmeden dilimi değiştir
function wirePager(av){
  av.querySelectorAll('[data-pg]').forEach(b=> b.onclick = ()=>{
    const [tag, n] = b.dataset.pg.split(':');
    if(tag === 'lsn'){ _lsnPage = +n; av.innerHTML = lessonsTable(_lsnData); }
    else if(tag === 'flg'){ _flgPage = +n; av.innerHTML = modFlagged(_flgData); wireFlagged(av); }

function wireLessons(av){
  av.querySelectorAll('[data-lu]').forEach(b=> b.onclick = async ()=>{
    if(!confirm('Bu dersin işaretlediği cüzdanlar geri alınsın mı?')) return;
    const j = await api('/lessons/'+b.dataset.lu+'/undo', {method:'POST'});
    flash((j.removed||0)+' cüzdan geri alındı'); _aiFirst = null; paintAiSub();
  });
  av.querySelectorAll('[data-lsn]').forEach(b=> b.onclick = ()=>{
    const l = (_lsnData && _lsnData.lessons || [])[+b.dataset.lsn];
    if(l) openLessonShare(l);

}
async function paintAiSub(){
  if(!['lessons','momentum','flagged'].includes(_aiSub)) _aiSub = 'lessons';
  document.querySelectorAll('#aiSub button').forEach(x=>x.classList.toggle('on', x.dataset.s===_aiSub));
  const av = $('#aiView'); av.innerHTML = '<p class="muted">yükleniyor…</p>';
  try{
    if(_aiSub==='lessons'){
      _lsnData = _aiFirst || await api('/lessons'); _aiFirst = null;
      _lsnPage = 1;
      av.innerHTML = lessonsTable(_lsnData);
      wireLessons(av); wirePager(av);
    }else if(_aiSub==='momentum'){
      _aiFirst = null;
      const d = await api('/momentum');
      av.innerHTML = momentumView(d);
      av.querySelectorAll('[data-mu]').forEach(b=> b.onclick = async ()=>{
        if(!confirm('Bu yükseliş dersinin kaydettiği adresler geri alınsın mı?')) return;
        const j = await api('/momentum/'+b.dataset.mu+'/undo', {method:'POST'});
        flash((j.removed||0)+' adres geri alındı'); paintAiSub();
      });
      av.querySelectorAll('[data-gx]').forEach(b=> b.onclick = async ()=>{
        if(!confirm('Bu adres yükseliş kaydından çıkarılsın mı?')) return;
        await api('/gainers/'+encodeURIComponent(b.dataset.gx), {method:'DELETE'});
        flash('çıkarıldı'); paintAiSub();
      });
    }else{
      _aiFirst = null;
      _flgData = await api('/flagged'); _flgPage = 1;
      av.innerHTML = modFlagged(_flgData);
      wireFlagged(av); wirePager(av);
    }
  }catch(e){ if(e.message!=='auth') av.innerHTML = `<p class="bad">${esc(e.message)}</p>`; }
}
const GN_KIND = { wallet:'erken alıcı', funder:'fonlayıcı', deployer:'deployer' };

      ${l.markers?`<button class="ghost sm" data-mu="${esc(l.mint)}">geri al</button>`:''}</td>
  </tr>`).join('');

  const grows = gainers.map(g=>`<tr>
    <td class="mono">${esc(g.address)}</td>
    <td>${GN_KIND[g.kind]||g.kind}</td>
    <td><span class="badge ${g.hits>=2?'b-hit':'b-open'}">×${g.hits}</span> ${g.hits>=2?'doğrulanmış':'ihtiyatlı'}</td>

    <td><button class="danger sm" data-gx="${esc(g.address)}">çıkar</button></td>
  </tr>`).join('');

  const hrows = hits.map(h=>`<tr>
    <td class="mono">${tokLink(h.mint, h.symbol||short(h.mint))}<div class="muted">${short(h.mint)}</div></td>

  return `

      "organic", "cabaled" ya da "inconclusive" denen tokenlar ${win} gün boyunca izlenir.

      besleyen ortak fonlayıcılar ve deployer <b>yükseliş kaydına</b> eklenir. Bir adres ≥2 ayrı
      yükselişte görülünce "doğrulanmış" sayılır. Sonraki taramalarda bu adresler bir tokenın

      bu karara (bundled/organic) etki ETMEZ, yalnızca bilgilendirmedir. Bu bir korelasyondur;
      nedensellik ya da fiyat tahmini değildir.</p></div>

    <div class="section-title">Yükselen tokenlardan çıkarılan dersler</div>
    <div class="tbl-card"><table>
      <thead><tr><th>ilk karar</th><th>token</th><th>yükseliş</th><th>ne öğrenildi?</th><th>kayıt</th></tr></thead>
      <tbody>${lrows||'<tr><td colspan="5" class="muted">henüz ders yok — izlenen bir token '+mult+'× yükselene kadar boş kalır</td></tr>'}</tbody></table></div>

    <div class="section-title">İzlenen "yükseliş sinyali" adresleri</div>
    <div class="tbl-card"><table>
      <thead><tr><th>adres</th><th>rol</th><th>durum</th><th>not</th><th></th></tr></thead>
      <tbody>${grows||'<tr><td colspan="5" class="muted">liste boş</td></tr>'}</tbody></table></div>

    <div class="section-title">Yükseliş sinyali yakalanan taramalar</div>
    <div class="tbl-card"><table>
      <thead><tr><th>token</th><th>karar</th><th>skor</th><th>sebep</th><th>ne zaman</th></tr></thead>
      <tbody>${hrows||'<tr><td colspan="5" class="muted">henüz eşleşen tarama yok</td></tr>'}</tbody></table></div>`;

function lessonsTable(d){

    return `<tr>
    <td>${vb(l.verdict_was)}<div class="muted">${ago(l.learned_at)} önce</div></td>
    <td class="mono">${tokLink(l.mint, l.symbol||short(l.mint))}<div class="muted">${short(l.mint)}</div></td>
    <td><b class="bad">−%${Math.round((l.drop_pct||0)*100)}</b></td>
    <td style="min-width:320px;max-width:540px;white-space:normal;line-height:1.55">${esc(l.detail||'')}${l.deployer?`<div class="muted" style="margin-top:4px">deployer: ${short(l.deployer)}</div>`:''}</td>
    <td style="white-space:nowrap;width:1%">
      <div class="muted">${(l.wallets_flagged||0)>0?`<b>${l.wallets_flagged}</b> adres kara listede`:'işaretleme yok'}</div>
      <div style="display:flex;gap:6px;margin-top:6px">
        <button class="link" data-lsn="${idx}">paylaş</button>
        ${l.wallets_flagged?`<button class="ghost sm" data-lu="${esc(l.mint)}">geri al</button>`:''}
      </div></td>
  </tr>`;
  }).join('');
  return `
    <div class="card"><p class="desc"><b>Öz-öğrenme döngüsü.</b> "organic" ya da "inconclusive" denip
      sonraki ${Math.round((d.window_h||24))} saatte sert çöken (≥%55) tokenlar burada listelenir.
      Sistem çöken her tokenın kayıtlı tarama verisini geriye dönük inceler; ortak fonlayıcı, gizli
      (çok-hop) fonlama ağacı, taze cüzdan kümesi ya da arzı tek elde toplamış bir cüzdan bulursa
      o adresleri (ve varsa deployer'ı) kalıcı kara listeye ("İşaretli cüzdanlar" sekmesi) ekler —
      sonraki taramalarda bu adresler "Daha önce işaretlenmiş cüzdanlar" sinyalini tetikler.
      "paylaş" → çöküş sebebini içeren, TR/EN, CA adresli hazır bir metin açar.</p></div>
    <div class="section-title">Çöküş dersleri <span class="cnt">${pg.total} ders</span></div>
    <div class="tbl-card"><table><thead><tr><th>karar</th><th>token</th><th>çöküş</th><th>ne öğrenildi?</th><th></th></tr></thead>
      <tbody>${rows||'<tr><td colspan="5" class="muted">henüz ders yok — organic bir token sert çökene kadar boş kalır</td></tr>'}</tbody></table></div>
    ${pagerHtml(pg.page, pg.pages, 'lsn')}`;
}

/* --- çöküş dersi paylaşım metni (modal) --- */
let _shareLesson = null, _shareLang = 'tr';
function lessonShareText(l, lang){
  const drop = Math.round((l.drop_pct||0)*100);
  const flagged = l.wallets_flagged || 0;
  const dep = l.deployer || '';
  const sym = l.symbol ? ('$' + l.symbol) : 'token';
  const url = `${location.origin}/t/${l.mint}`;
  const isRug = l.outcome === 'rug';
  const parts = [];
  if(lang === 'en'){
    parts.push(`🚨 CRASH DETECTED — ${sym}`);
    parts.push(`Scanned as "${l.verdict_was}" — then ${isRug ? 'the developer pulled liquidity' : `it dropped ${drop}%`} shortly after.`);
    // detail_en backend'den gelir; eski kayıtlarda yoksa yapılandırılmış özet
    if(l.detail_en){
      parts.push(l.detail_en);
    }else if(isRug){
      parts.push(`The token's creator${dep ? ` (${dep})` : ''} pulled the pool liquidity — a rug. ${dep ? 'The creator was added to the permanent blacklist.' : 'The pool creator could not be resolved, so nobody was flagged.'}`);
    }else if(flagged){
      parts.push(`The saved scan data was re-examined and coordinated-distribution traces were found. ${flagged} address(es)${dep ? ' including the deployer' : ''} were added to the permanent blacklist — from now on every scan they appear in triggers the "previously flagged wallets" signal.`);
    }else{
      parts.push(`The saved scan data was re-examined but no coordinated-distribution trace (shared funder, hidden funding tree, fresh-wallet cluster, single-wallet supply) was found — most likely a general market/liquidity crash, not a coordinated rug. No addresses were flagged.`);
    }
    if(dep) parts.push(`Deployer: ${dep}`);
    parts.push(`CA: ${l.mint}`);
    parts.push(`Scan result: ${url}`);
    parts.push(`— america.sx · on-chain launch forensics, self-learning`);
  }else{
    parts.push(`🚨 ÇÖKÜŞ TESPİTİ — ${sym}`);
    parts.push(`"${l.verdict_was}" olarak tarandı — kısa süre sonra ${isRug ? 'geliştirici likiditeyi çekti' : `%${drop} düştü`}.`);
    parts.push(l.detail || '(ayrıntı kaydedilmedi)');
    if(dep) parts.push(`Üretici (deployer): ${dep}`);
    parts.push(`CA: ${l.mint}`);
    parts.push(`Tarama sonucu: ${url}`);
    parts.push(`— america.sx · zincir-üstü lansman adli analizi, öz-öğrenme`);
  }
  return parts.join('\n\n');
}
function openLessonShare(l){
  _shareLesson = l; _shareLang = 'tr';
  document.querySelectorAll('#lsnLang button').forEach(b => b.classList.toggle('on', b.dataset.l === 'tr'));
  $('#lsnShareText').value = lessonShareText(l, 'tr');
  $('#lsnShareModal').classList.remove('hidden');
}

/* ================= KARNE ================= */
let _trkAll = null, _trkSub = 'all';
const TRK_GROUPS = [
  ['all','Hepsi'], ['bundled','Bundled'], ['cabaled','Cabaled'],
  ['organic','Organic'], ['inconclusive','Inconclusive'],
];
function renderTrack(d){
  _trkAll = d;
  const recs = d.records || [];
  const cnt = k => k === 'all' ? recs.length : recs.filter(t => t.verdict === k).length;
  $('#view').innerHTML = `
    <div class="card"><p class="desc">Taranan her token 24 saat izlenir; tarama anına göre en düşük noktadaki düşüş eşiği geçerse "çöktü" sayılır (isabet / kaçırdı / korudu). Sekmeler tokenları taramadaki sınıflandırmalarına göre ayırır.</p></div>
    <div class="subtabs" id="trkSub">
      ${TRK_GROUPS.map(([k,l])=>`<button data-s="${k}">${l} <span class="muted">${cnt(k)}</span></button>`).join('')}
    </div>
    <div id="trkView"><p class="muted">yükleniyor…</p></div>`;
  $('#trkSub').onclick = e => {
    const b = e.target.closest('button'); if(!b) return;
    _trkSub = b.dataset.s; paintTrkSub();
  };
  paintTrkSub();
}
function paintTrkSub(){
  const recs = (_trkAll && _trkAll.records) || [];
  if(!TRK_GROUPS.some(([k]) => k === _trkSub)) _trkSub = 'all';
  document.querySelectorAll('#trkSub button').forEach(x => x.classList.toggle('on', x.dataset.s === _trkSub));
  const list = _trkSub === 'all' ? recs : recs.filter(t => t.verdict === _trkSub);

  const done = list.filter(t => t.settled);
  const open = list.length - done.length;
  const correct = done.filter(t => t.outcome === 'hit' || t.outcome === 'clear').length;
  const summary = `${list.length} token · ${open} izlemede · ${done.length} sonuçlandı`
    + (done.length ? ` · <b class="ok">${correct} doğru</b>` : '');

  const rows = list.map(t => {
    const chg = t.change_pct;
    const dl = chg == null ? '—' : ((chg > 0 ? '+' : '') + Math.round(chg * 100) + '%');
    return `<tr>
      <td>${vb(t.verdict)}</td>
      <td class="mono">${tokLink(t.mint, t.symbol || short(t.mint))}<div class="muted">${short(t.mint)}</div></td>
      <td>${money(t.mcap_at_scan)} → ${money(t.mcap_latest)} <b class="${chg < 0 ? 'bad' : 'ok'}">${dl}</b></td>
      <td>${t.settled ? vb(t.outcome) : ('izleniyor ' + ago(t.scored_at))}</td>
      <td><button class="danger sm" data-tm="${esc(t.mint)}">sil</button></td>
    </tr>`;
  }).join('');

  const v = $('#trkView');
  v.innerHTML = `
    <div class="statusline">${summary}</div>
    <div class="tbl-card"><table>
      <thead><tr><th>karar</th><th>token</th><th>mcap</th><th>sonuç</th><th></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5" class="muted">bu sınıfta izlenen token yok</td></tr>'}</tbody></table></div>`;
  v.querySelectorAll('[data-tm]').forEach(b => b.onclick = async () => {
    if(!confirm('Karne kaydı silinsin mi?')) return;
    await api('/track/' + b.dataset.tm, {method:'DELETE'}); flash('silindi'); route('track');
  });
}

const CC_NAME = {
  TR:'Türkiye', US:'ABD', DE:'Almanya', GB:'Birleşik Krallık', FR:'Fransa',
  NL:'Hollanda', RU:'Rusya', UA:'Ukrayna', IN:'Hindistan', BR:'Brezilya',
  CA:'Kanada', AU:'Avustralya', ES:'İspanya', IT:'İtalya', PL:'Polonya',
  AE:'BAE', SA:'S. Arabistan', AZ:'Azerbaycan', KZ:'Kazakistan', ID:'Endonezya',
  NG:'Nijerya', VN:'Vietnam', PH:'Filipinler', JP:'Japonya', KR:'G. Kore',
  CN:'Çin', MX:'Meksika', AR:'Arjantin', SE:'İsveç', CH:'İsviçre',
};
function bars(items, keyFn){
  if(!items || !items.length) return '<tr><td colspan="2" class="muted">kayıt yok</td></tr>';
  const top = items[0].n || 1;
  return items.map(r=>{
    const w = Math.max(4, Math.round((r.n / top) * 100));
    return `<tr><td>${esc(keyFn(r))}
      <div style="height:4px;background:var(--rule);border-radius:2px;margin-top:5px;overflow:hidden">
        <i style="display:block;height:100%;width:${w}%;background:var(--gold-dim)"></i></div></td>
      <td style="text-align:right;width:1%;white-space:nowrap"><b>${r.n}</b></td></tr>`;
  }).join('');
}
function renderVisits(d){
  const o = d.overview || {}, s = o.series || [];
  const smax = s.reduce((a,b)=> Math.max(a, b.n), 0) || 1;
  const spark = s.length
    ? `<div style="display:flex;align-items:flex-end;gap:3px;height:56px;margin-top:10px">
        ${s.map(p=>{
          const h = Math.max(3, Math.round(p.n/smax*100));
          const dt = new Date(p.day*1000).toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit'});
          return `<div title="${dt}: ${p.n} ziyaret · ${p.uniq} tekil"
            style="flex:1;min-width:5px;height:${h}%;background:var(--gold-dim);border-radius:2px 2px 0 0"></div>`;
        }).join('')}
       </div>
       <div class="muted" style="margin-top:4px">son ${s.length} gün · günlük ziyaret</div>`
    : '<p class="muted">henüz veri yok — ilk ziyaretlerden sonra grafik çizilir</p>';

  $('#view').innerHTML = `
    <div class="card"><p class="desc">Sayfa görüntülemeleri — sunucu tarafında, JS gerektirmeden sayılıyor.
      IP <b>saklanmıyor</b>: günlük dönen bir tuzla hash'lenip yalnızca "gün içi tekil ziyaretçi" için kullanılıyor.
      Botlar (Twitterbot, arama motorları…) ayrı sayılıyor. "Nereden geldi" = tarayıcının Referer başlığı.
      Ülke bilgisi ${d.geoip
        ? '<b>ipapi.co</b> ile çözülüyor (anahtarsız, önbellekli).'
        : 'yalnızca bir CDN (ör. Cloudflare) <code>CF-IPCountry</code> başlığı gönderiyorsa görünür — ' +
          'sunucuda <code>GEOIP=1</code> ile ipapi.co çözümü de açılabilir.'}</p></div>

    <div class="section-title">Özet</div>
    <div class="card sumcard"><div class="sumgrp"><div class="sumrow">
      <div class="sumcell"><b>${o.total ?? 0}</b><span>toplam</span></div>
      <div class="sumcell"><b>${o.d30 ?? 0}</b><span>son 30 gün</span></div>
      <div class="sumcell"><b>${o.d7 ?? 0}</b><span>son 7 gün</span></div>
      <div class="sumcell"><b>${o.d1 ?? 0}</b><span>son 24 saat</span></div>
      <div class="sumcell"><b>${o.uniq_d7 ?? 0}</b><span>tekil · 7 gün</span></div>
      <div class="sumcell"><b>${o.uniq_d1 ?? 0}</b><span>tekil · 24 saat</span></div>
      <div class="sumcell"><b>${o.bot_total ?? 0}</b><span>bot (toplam)</span></div>
    </div>${spark}</div></div>

    <div class="split2">
      <div>
        <div class="section-title">Nereden geldi <span class="cnt">son 7 gün</span></div>
        <div class="tbl-card"><table><thead><tr><th>kaynak</th><th style="text-align:right">ziyaret</th></tr></thead>
          <tbody>${bars(d.referrers, r=>r.host)}</tbody></table></div>
        <div class="section-title" style="margin-top:18px">Nereden geldi <span class="cnt">son 30 gün</span></div>
        <div class="tbl-card"><table><thead><tr><th>kaynak</th><th style="text-align:right">ziyaret</th></tr></thead>
          <tbody>${bars(d.referrers_30||[], r=>r.host)}</tbody></table></div>
      </div>
      <div>
        <div class="section-title">Ülke <span class="cnt">son 7 gün</span></div>
        <div class="tbl-card"><table><thead><tr><th>ülke</th><th style="text-align:right">ziyaret</th></tr></thead>
          <tbody>${bars(d.countries||[], r=> (CC_NAME[r.country]||r.country))}</tbody></table></div>
        <div class="section-title" style="margin-top:18px">Ülke <span class="cnt">son 30 gün</span></div>
        <div class="tbl-card"><table><thead><tr><th>ülke</th><th style="text-align:right">ziyaret</th></tr></thead>
          <tbody>${bars(d.countries_30||[], r=> (CC_NAME[r.country]||r.country))}</tbody></table></div>

}

/* ================= ARAÇLAR ================= */
function renderTools(){
  $('#view').innerHTML = `
    <div class="card">
      <h3>Önbellek / yeniden tarama</h3>
      <p class="desc">Bir mint için önbelleği temizle ya da zincirden zorla yeniden tara (60–90 sn).</p>
      <div class="field"><div class="row">
        <input id="tmint" placeholder="mint adresi" style="flex:1 1 320px">
        <button class="ghost" id="tclear">önbelleği sil</button>
        <button id="trescan">zorla yeniden tara</button>
      </div></div>
      <pre id="tout" class="muted" style="white-space:pre-wrap;max-height:280px;overflow:auto;margin:0"></pre>
    </div>

    <div class="card">
      <h3>Veritabanı yedeği</h3>
      <p class="desc">Tüm tabloların (öğrenilen kara liste, yükseliş kayıtları, dersler,
        itirazlar, karne, ayarlar, cüzdan meta önbelleği, tarama geçmişi…) tek bir JSON
        dosyası olarak yedeği. Render ücretsiz katmanında Postgres yoksa veri yeniden
        başlatmada sıfırlanır — bunu düzenli indir.</p>
      <div class="field"><label style="text-transform:none;letter-spacing:0;color:var(--text)">
        <input type="checkbox" id="bkScans" checked style="width:auto;vertical-align:-2px"> Tarama önbelleğini de dahil et (dosya büyür)
      </label></div>
      <div class="card-actions">
        <span class="note">İndirilen dosyayı güvenli bir yerde sakla.</span>
        <button id="bkDownload">Tam yedeği indir</button>
      </div>
    </div>

    <div class="card">
      <h3>Yedekten geri yükle</h3>
      <p class="desc"><b style="color:var(--red)">Dikkat:</b> yedekteki tabloların
        MEVCUT verisini siler ve dosyadakiyle değiştirir. Bu işlem geri alınamaz.
        Önce güncel bir yedek indir.</p>
      <div class="field"><div class="row">
        <input type="file" id="rsFile" accept=".json,application/json" style="flex:1 1 260px">
      </div></div>
      <div class="field"><label style="text-transform:none;letter-spacing:0;color:var(--text)">
        <input type="checkbox" id="rsConfirm" style="width:auto;vertical-align:-2px"> Mevcut verinin silineceğini anladım
      </label></div>
      <div class="card-actions">
        <span class="note" id="rsInfo">—</span>
        <button class="danger" id="rsRestore" disabled>Geri yükle</button>
      </div>
      <pre id="rsOut" class="muted" style="white-space:pre-wrap;max-height:220px;overflow:auto;margin:8px 0 0"></pre>
    </div>`;

  $('#bkDownload').onclick = async ()=>{
    const btn = $('#bkDownload'); btn.disabled = true; const o = btn.textContent;
    btn.textContent = 'hazırlanıyor…';
    try{
      const full = $('#bkScans').checked ? 1 : 0;
      const r = await fetch('/api/admin/backup?full='+full, { headers:{'X-Admin-Token':TOKEN} });
      if(!r.ok) throw new Error('HTTP '+r.status);
      const blob = await r.blob();
      const cd = r.headers.get('Content-Disposition') || '';
      const m = cd.match(/filename="?([^"]+)"?/);
      const name = (m && m[1]) || ('solscope-yedek-'+Date.now()+'.json');
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click();
      a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 4000);
      flash('yedek indirildi ('+Math.round(blob.size/1024)+' KB)');
    }catch(e){ flash('yedek alınamadı: '+e.message); }
    finally{ btn.disabled = false; btn.textContent = o; }
  };

  let _rsData = null;
  const rsSync = ()=>{ $('#rsRestore').disabled = !(_rsData && $('#rsConfirm').checked); };
  $('#rsConfirm').onchange = rsSync;
  $('#rsFile').onchange = ()=>{
    const f = $('#rsFile').files[0]; _rsData = null; rsSync();
    if(!f){ $('#rsInfo').textContent = '—'; return; }
    const rd = new FileReader();
    rd.onload = ()=>{
      try{
        const d = JSON.parse(rd.result);
        if(d.format !== 'solscope-backup') throw new Error('SolScope yedeği değil');
        _rsData = d;
        const c = d.counts || {};
        const tot = Object.values(c).reduce((a,b)=>a+b,0);
        const when = d.generated_at ? new Date(d.generated_at*1000).toLocaleString() : '?';
        $('#rsInfo').textContent = `${when} · ${tot} satır · ${Object.keys(c).length} tablo`;
      }catch(e){ $('#rsInfo').textContent = 'geçersiz: '+e.message; }
      rsSync();
    };
    rd.readAsText(f);
  };
  $('#rsRestore').onclick = async ()=>{
    if(!_rsData || !confirm('Mevcut veri silinip yedekle değiştirilecek. Emin misin?')) return;
    const btn = $('#rsRestore'); btn.disabled = true; const o = btn.textContent;
    btn.textContent = 'yükleniyor…'; $('#rsOut').textContent = '';
    try{
      const j = await api('/restore', { method:'POST', body: JSON.stringify({ data: _rsData }) });
      const lines = Object.entries(j.restored||{}).map(([t,n])=> `  ${t}: ${n<0?'HATA':n+' satır'}`);
      $('#rsOut').textContent = 'Geri yüklendi:\n'+lines.join('\n');
      flash('geri yükleme tamam');
    }catch(e){ $('#rsOut').textContent = 'hata: '+e.message; flash(e.message); }
    finally{ btn.disabled = false; btn.textContent = o; }
  };

  $('#tclear').onclick = async ()=>{
    const m = $('#tmint').value.trim(); if(!m) return;
    try{ await api('/cache/'+m, {method:'DELETE'}); flash('önbellek silindi'); }
    catch(e){ flash(e.message); }
  };
  $('#trescan').onclick = async ()=>{
    const m = $('#tmint').value.trim(); if(!m) return;
    const btn = $('#trescan'); btn.disabled = true;
    $('#tout').textContent = 'taranıyor… (60–90 sn)';
    try{
      const j = await api('/rescan/'+m, {method:'POST'});
      $('#tout').textContent = `${j.verdict.label} · skor ${j.verdict.score} · güven ${j.verdict.confidence}\n`+
        (j.verdict.reasons||[]).join('\n');
      flash('tarandı');
    }catch(e){ $('#tout').textContent = e.message; }
    finally{ btn.disabled = false; }
  };
}

if(TOKEN){ api('/overview').then(()=>{ showPanel(); route('panel'); }).catch(()=>{}); }
else showLogin('');
